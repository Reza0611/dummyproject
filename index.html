<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ada hadiah untukmu 💗</title>
<style>
:root{--bg:#fff0f5;--ink:#b0245f;--soft:#7a3555;--card:rgba(255,255,255,.78);--btn:#ff4d94;--btnink:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1020;--ink:#ff8fc0;--soft:#f3c4d9;--card:rgba(60,20,42,.78)}}
:root[data-theme="dark"]{--bg:#2a1020;--ink:#ff8fc0;--soft:#f3c4d9;--card:rgba(60,20,42,.78)}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
#hint{position:fixed;left:0;right:0;top:66%;text-align:center;font-size:clamp(20px,5vw,28px);font-weight:700;font-style:italic;pointer-events:none;transition:opacity .6s}
#hint small{display:block;margin-top:8px;font-size:15px;font-weight:400;font-style:normal;color:var(--soft);animation:b 1.6s ease-in-out infinite}
@keyframes b{50%{opacity:.35}}
#card{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);width:min(440px,calc(100% - 32px));transform:translate(-50%,30px);opacity:0;pointer-events:none;
background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:24px;padding:22px 22px 18px;text-align:center;box-shadow:0 10px 40px rgba(255,77,148,.25);transition:all .8s ease;box-sizing:border-box}
#card.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#card h1{margin:0 0 10px;font-size:clamp(22px,6vw,28px)}
#msg{margin:0;line-height:1.6;color:var(--soft);font-size:16px;min-height:5.5em;white-space:pre-wrap}
#from{margin:10px 0 14px;font-style:italic;color:var(--ink)}
button{border:0;background:var(--btn);color:var(--btnink);font:inherit;font-weight:700;padding:12px 26px;border-radius:999px;cursor:pointer;box-shadow:0 4px 14px rgba(255,77,148,.4)}
button:active{transform:scale(.96)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">Ada sesuatu untukmu 💌<small>ketuk hatinya</small></div>
<div id="card">
  <h1 id="to"></h1>
  <p id="msg"></p>
  <div id="from"></div>
  <button id="send">Kirim cinta 💗</button>
</div>
<script>
// ====== UBAH BAGIAN INI ======
const NAMA = "Seseorang Spesial";
const PENGIRIM = "Aku";
const PESAN = "Terima kasih sudah hadir dan membuat hari-hariku lebih berwarna.\nSemoga kamu selalu bahagia, hari ini dan seterusnya.";
// =============================

const c = document.getElementById('c'), x = c.getContext('2d');
const PINKS = ["#ff69b4","#ff85c1","#ffb6c1","#ff4d94","#f78fb3","#ff99cc"];
let W, H, D, t = 0, opened = false, hs = 0, hy = 0, hsT = 0, hyT = 0;

function fit(){
  D = window.devicePixelRatio || 1; W = innerWidth; H = innerHeight;
  c.width = W * D; c.height = H * D; x.setTransform(D,0,0,D,0,0);
  hsT = opened ? Math.min(W,H)*.1 : Math.min(W,H)*.2;
  hyT = opened ? H*.17 : H*.38;
  if(!hs){hs = hsT; hy = hyT;}
}
addEventListener('resize', fit); fit();

function heart(cx, cy, s, col, a){
  x.globalAlpha = a; x.fillStyle = col; x.beginPath();
  for(let i = 0; i <= 360; i += 8){
    const r = i * Math.PI / 180;
    const px = 16 * Math.sin(r) ** 3;
    const py = 13*Math.cos(r) - 5*Math.cos(2*r) - 2*Math.cos(3*r) - Math.cos(4*r);
    const X = cx + px * s / 16, Y = cy - py * s / 16;
    i ? x.lineTo(X, Y) : x.moveTo(X, Y);
  }
  x.closePath(); x.fill(); x.globalAlpha = 1;
}

function floater(first){
  return {x: Math.random()*W, y: first ? Math.random()*H : H + 40 + Math.random()*120,
    s: 10 + Math.random()*26, v: .6 + Math.random()*1.8, p: Math.random()*6.28,
    w: .5 + Math.random()*1.5, col: PINKS[Math.random()*PINKS.length | 0], a: .35 + Math.random()*.5};
}
const fl = Array.from({length: 36}, () => floater(true));
let bursts = [];

function burst(px, py, n = 14){
  for(let i = 0; i < n; i++){
    const ang = Math.random()*6.28, sp = 1.5 + Math.random()*4;
    bursts.push({x: px, y: py, vx: Math.cos(ang)*sp, vy: Math.sin(ang)*sp - 2,
      s: 8 + Math.random()*16, col: PINKS[Math.random()*PINKS.length | 0], life: 1});
  }
}

function frame(){
  t += .04; x.clearRect(0, 0, W, H);
  for(const f of fl){
    f.y -= f.v;
    heart(f.x + Math.sin(t*2 + f.p) * 18 * f.w, f.y, f.s, f.col, f.a);
    if(f.y < -50) Object.assign(f, floater(false));
  }
  hs += (hsT - hs) * .05; hy += (hyT - hy) * .05;
  const pulse = hs * (1 + .08 * Math.sin(t*4));
  heart(W/2, hy, pulse, "#ff3d88", 1);
  x.globalAlpha = .35; x.fillStyle = "#fff"; x.beginPath();
  x.ellipse(W/2 - pulse*.35, hy - pulse*.3, pulse*.14, pulse*.08, -.6, 0, 6.28); x.fill(); x.globalAlpha = 1;
  bursts = bursts.filter(b => b.life > 0);
  for(const b of bursts){
    b.x += b.vx; b.y += b.vy; b.vy += .08; b.life -= .016;
    heart(b.x, b.y, b.s, b.col, Math.max(b.life, 0));
  }
  requestAnimationFrame(frame);
}
frame();

function typeText(el, text){
  let i = 0; el.textContent = "";
  const id = setInterval(() => { el.textContent = text.slice(0, ++i); if(i >= text.length) clearInterval(id); }, 45);
}

function open(){
  opened = true; fit();
  document.getElementById('hint').style.opacity = 0;
  document.getElementById('to').textContent = "Untuk " + NAMA + " 💗";
  document.getElementById('from').textContent = "— " + PENGIRIM;
  document.getElementById('card').classList.add('on');
  burst(W/2, hy, 50);
  setTimeout(() => typeText(document.getElementById('msg'), PESAN), 700);
}

function tap(e){
  const p = e.touches ? e.touches[0] : e;
  const px = p.clientX, py = p.clientY;
  if(!opened && Math.hypot(px - W/2, py - hy) < hs * 1.3) return open();
  burst(px, py);
}
c.addEventListener('pointerdown', tap);
c.addEventListener('pointermove', e => { if(e.buttons || e.pointerType === 'mouse' && Math.random() < .25) burst(e.clientX, e.clientY, 1); });
document.getElementById('send').addEventListener('click', () => burst(W/2, H*.6, 60));
</script>
</body>
</html>
